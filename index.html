<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildeutskrift</title>

  <!-- Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 450px; width: 100%; text-align: center; }
    
    .logo-container { margin-bottom: 20px; text-align: center; }
    .logo-container img { max-width: 180px; height: auto; display: block; margin: 0 auto; }

    .btn-select {
      background: #007aff; color: white; border: none; padding: 16px 20px;
      border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%;
      cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.25);
      margin-bottom: 20px; transition: background 0.2s;
    }
    .btn-select:active { background: #0056b3; }

    .a4-preview {
      width: 100%; aspect-ratio: 1 / 1.414; background: white; border: 1px solid #e0e0e0;
      border-radius: 12px; padding: 10px; display: grid;
      grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .slot {
      border: 2px dashed #ccc; border-radius: 8px; display: flex; justify-content: center;
      align-items: center; overflow: hidden; position: relative; background: #fafafa;
      cursor: pointer; transition: border-color 0.2s;
    }
    .slot.filled { border: 2px solid #007aff; }
    .slot img { width: 100%; height: 100%; object-fit: cover; }
    .slot-icon { font-size: 24px; color: #bbb; font-weight: 300; }
    
    .btn-submit {
      background: #34c759; color: white; border: none; padding: 16px;
      border-radius: 12px; font-size: 17px; font-weight: 600; width: 100%;
      cursor: pointer; box-shadow: 0 4px 12px rgba(52,199,89,0.25);
    }
    .btn-submit:disabled { background: #d1d1d6; box-shadow: none; cursor: not-allowed; }
    
    .code-box { display: none; background: #eefbf1; border: 2px solid #34c759; padding: 20px; border-radius: 12px; margin-top: 20px; }
    .code-box h2 { margin: 10px 0 0 0; color: #248a3d; font-size: 42px; letter-spacing: 2px; }
    .code-box p { margin: 0; color: #248a3d; font-size: 15px; }

    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content { max-width: 90%; max-height: 70vh; margin-bottom: 15px; background: #000; }
    .modal-buttons { display: flex; gap: 10px; width: 100%; max-width: 400px; }
    .btn-modal {
      flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .btn-cancel { background: #8e8e93; color: white; }
    .btn-save { background: #007aff; color: white; }
  </style>
</head>
<body>

<div class="container">
  <!-- Logo Område -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
  </div>

  <button class="btn-select" onclick="document.getElementById('multiInput').click()">Velg 6 bilder fra galleriet</button>
  <input type="file" id="multiInput" accept="image/*" multiple style="display:none;" onchange="handleFiles(this.files)">

  <div class="a4-preview">
    <div class="slot" id="slot-0" onclick="editSlot(0)"><span class="slot-icon">+</span></div>
    <div class="slot" id="slot-1" onclick="editSlot(1)"><span class="slot-icon">+</span></div>
    <div class="slot" id="slot-2" onclick="editSlot(2)"><span class="slot-icon">+</span></div>
    <div class="slot" id="slot-3" onclick="editSlot(3)"><span class="slot-icon">+</span></div>
    <div class="slot" id="slot-4" onclick="editSlot(4)"><span class="slot-icon">+</span></div>
    <div class="slot" id="slot-5" onclick="editSlot(5)"><span class="slot-icon">+</span></div>
  </div>

  <button class="btn-submit" id="submitBtn" disabled onclick="uploadImages()">Få utskriftskode</button>

  <div class="code-box" id="codeBox">
    <p>Din utskriftskode:</p>
    <h2 id="printCode">----</h2>
    <p style="margin-top: 8px; font-size: 13px; color: #555;">Oppgi denne koden til betjeningen ved utskrift.</p>
  </div>
</div>

<!-- Crop Modal -->
<div class="modal" id="cropModal">
  <div class="modal-content">
    <img id="cropImage" src="" style="max-width: 100%;">
  </div>
  <div class="modal-buttons">
    <button class="btn-modal btn-cancel" onclick="closeModal()">Avbryt</button>
    <button class="btn-modal btn-save" onclick="saveCrop()">Lagre bilde</button>
  </div>
</div>

<script>
  // Firebase Konfigurasjon
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
    authDomain: "magnet-c8c2a.firebaseapp.com",
    databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "magnet-c8c2a",
    storageBucket: "magnet-c8c2a.firebasestorage.app",
    messagingSenderId: "148748324402",
    appId: "1:148748324402:web:878ce829b2038c8613362b"
  };
  
  try {
    firebase.initializeApp(firebaseConfig);
  } catch (e) {
    console.log("Firebase initialize error:", e);
  }
  
  const db = firebase.database();

  let originalImages = new Array(6).fill(null);
  let processedImages = new Array(6).fill(null);
  let cropper = null;
  let currentSlotIndex = null;

  // Fotoğrafları sıkıştırarak Data URL dönüştürme fonksiyonu
  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // JPEG kalitesini düşürerek boyutu %80 küçültür
        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(compressedDataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function handleFiles(files) {
    if (files.length !== 6) {
      alert("Vennligst velg nøyaktig 6 bilder! (Valgt nå: " + files.length + ")");
      return;
    }

    let loadedCount = 0;
    Array.from(files).forEach((file, index) => {
      compressImage(file, 600, 0.7, function(compressedUrl) {
        originalImages[index] = compressedUrl;
        processedImages[index] = compressedUrl;
        
        updateSlotUI(index, compressedUrl);
        loadedCount++;

        if (loadedCount === 6) {
          document.getElementById('submitBtn').disabled = false;
        }
      });
    });
  }

  function updateSlotUI(index, imgSrc) {
    const slot = document.getElementById(`slot-${index}`);
    slot.innerHTML = `<img src="${imgSrc}">`;
    slot.classList.add('filled');
  }

  function editSlot(index) {
    if (!originalImages[index]) return;
    currentSlotIndex = index;

    const modal = document.getElementById('cropModal');
    const image = document.getElementById('cropImage');
    image.src = originalImages[index];

    modal.style.display = 'flex';

    if (cropper) cropper.destroy();
    cropper = new Cropper(image, {
      aspectRatio: 1,
      viewMode: 1,
      background: false,
      autoCropArea: 1
    });
  }

  function closeModal() {
    document.getElementById('cropModal').style.display = 'none';
    if (cropper) cropper.destroy();
  }

  function saveCrop() {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
    const croppedDataURL = canvas.toDataURL('image/jpeg', 0.7);

    processedImages[currentSlotIndex] = croppedDataURL;
    updateSlotUI(currentSlotIndex, croppedDataURL);
    closeModal();
  }

  function uploadImages() {
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Laster opp...";

    const code = Math.floor(1000 + Math.random() * 9000).toString();
    
    // Yükleme işlemini zaman aşımına karşı takip edelim (10 saniye)
    const timeout = setTimeout(() => {
      alert("Nettverket er tregt. Vennligst prøv igjen!");
      submitBtn.disabled = false;
      submitBtn.innerText = "Få utskriftskode";
    }, 10000);

    db.ref('prints/' + code).set({
      images: processedImages,
      timestamp: Date.now()
    }).then(() => {
      clearTimeout(timeout);
      document.getElementById('printCode').innerText = code;
      document.getElementById('codeBox').style.display = 'block';
      submitBtn.innerText = "Få utskriftskode";
    }).catch(err => {
      clearTimeout(timeout);
      alert("Feil oppstod: " + err.message);
      submitBtn.disabled = false;
      submitBtn.innerText = "Få utskriftskode";
    });
  }
</script>

</body>
</html>
