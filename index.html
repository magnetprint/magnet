<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 Magnet Tasarım</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 450px; width: 100%; text-align: center; }
    
    /* A4 Oranlı Ön İzleme Alanı (210x297mm Oranı) */
    .a4-preview {
      width: 100%;
      aspect-ratio: 1 / 1.414;
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    
    .slot {
      border: 2px dashed #bbb;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: #fafafa;
      cursor: pointer;
    }
    .slot img { width: 100%; height: 100%; object-fit: cover; }
    .slot span { font-size: 12px; color: #888; font-weight: bold; }

    .btn { background: #007aff; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn:disabled { background: #ccc; }
    
    .code-box { display: none; background: #eef9f2; border: 2px solid #34c759; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .code-box h2 { margin: 0; color: #34c759; font-size: 36px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container">
  <h2>6'lı Magnet Tasarımı</h2>
  <p style="font-size: 13px; color: #666;">Kutulara dokunarak 6 adet fotoğraf seçin:</p>

  <!-- A4 Ön İzleme Sayfası -->
  <div class="a4-preview" id="a4Canvas">
    <div class="slot" onclick="triggerInput(0)"><span id="txt-0">+ Fotoğraf 1</span><img id="img-0" style="display:none;"></div>
    <div class="slot" onclick="triggerInput(1)"><span id="txt-1">+ Fotoğraf 2</span><img id="img-1" style="display:none;"></div>
    <div class="slot" onclick="triggerInput(2)"><span id="txt-2">+ Fotoğraf 3</span><img id="img-2" style="display:none;"></div>
    <div class="slot" onclick="triggerInput(3)"><span id="txt-3">+ Fotoğraf 4</span><img id="img-3" style="display:none;"></div>
    <div class="slot" onclick="triggerInput(4)"><span id="txt-4">+ Fotoğraf 5</span><img id="img-4" style="display:none;"></div>
    <div class="slot" onclick="triggerInput(5)"><span id="txt-5">+ Fotoğraf 6</span><img id="img-5" style="display:none;"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none;">

  <button class="btn" id="sendBtn" onclick="processAndUpload()">Baskı Kodu Al</button>

  <div class="code-box" id="codeBox">
    <p style="margin:0;">Baskı Kodunuz:</p>
    <h2 id="printCode">----</h2>
    <p style="font-size:12px; color:#555;">Bu kodu stanttaki görevliye söyleyerek A4 magnetinizi alabilirsiniz.</p>
  </div>
</div>

<script>
  // Firebase Yapılandırması
  const firebaseConfig = {
  apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
  authDomain: "magnet-c8c2a.firebaseapp.com",
  databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "magnet-c8c2a",
  storageBucket: "magnet-c8c2a.firebasestorage.app",
  messagingSenderId: "148748324402",
  appId: "1:148748324402:web:878ce829b2038c8613362b"
};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let activeIndex = null;
  let loadedCount = 0;

  function triggerInput(index) {
    activeIndex = index;
    document.getElementById('fileInput').click();
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && activeIndex !== null) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = document.getElementById('img-' + activeIndex);
        img.src = evt.target.result;
        img.style.display = 'block';
        document.getElementById('txt-' + activeIndex).style.display = 'none';
        loadedCount++;
      };
      reader.readAsDataURL(file);
    }
  });

  function processAndUpload() {
    if (loadedCount === 0) {
      alert("Lütfen en az 1 fotoğraf seçin!");
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.innerText = "A4 Sayfası Hazırlanıyor...";
    btn.disabled = true;

    // A4 Alanını Tek Bir Yüksek Çözünürlüklü Resme Dönüştür
    const a4Area = document.getElementById('a4Canvas');
    html2canvas(a4Area, { scale: 2 }).then(canvas => {
      const compiledImage = canvas.toDataURL('image/jpeg', 0.85);
      const randomCode = Math.floor(1000 + Math.random() * 9000);

      db.ref('prints/' + randomCode).set({
        code: randomCode,
        image: compiledImage,
        timestamp: Date.now()
      }, function(err) {
        if (!err) {
          btn.style.display = 'none';
          document.getElementById('printCode').innerText = randomCode;
          document.getElementById('codeBox').style.display = 'block';
        } else {
          alert("Hata oluştu!");
          btn.disabled = false;
        }
      });
    });
  }
</script>
</body>
</html>
