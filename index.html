<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Følles Bra Magnet - Bestilling</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #ffffff; /* Tam beyaz arka plan */
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 30 DERECE EĞİKLİKLİ REPEAT LOGO ARKA PLAN FİLİGRANI */
    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: -1;
      pointer-events: none;
      background-image: url('logo.png'); 
      background-repeat: repeat;
      background-size: 110px 110px;
      opacity: 0.18;
      transform: rotate(-30deg);
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 140px;
      height: auto;
    }

    h1 {
      color: #222;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
    }

    .btn-upload {
      border: 2px dashed #007aff;
      color: #007aff;
      background-color: #f0f7ff;
      padding: 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-upload:hover {
      background-color: #e1f0ff;
    }

    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .preview-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-submit {
      background: #34c759;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .code-display {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #eef9f1;
      border: 2px solid #34c759;
      border-radius: 12px;
    }

    .code-number {
      font-size: 42px;
      font-weight: bold;
      color: #278a3f;
      letter-spacing: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-container">
    <img src="logo.png" alt="Logo">
  </div>

  <h1>Last opp dine bilder</h1>
  <p class="subtitle">Velg opptil 6 bilder for å lage dine magneter</p>

  <div class="upload-btn-wrapper">
    <button class="btn-upload">+ Velg bilder (Maks 6)</button>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)">
  </div>

  <div class="preview-grid" id="previewGrid"></div>

  <button class="btn-submit" id="submitBtn" onclick="uploadImages()" disabled>Send inn (Fullfør)</button>

  <div class="code-display" id="codeDisplay">
    <p style="margin: 0; color: #333; font-weight: bold;">Din utskriftskode:</p>
    <div class="code-number" id="generatedCode">----</div>
    <p style="margin: 0; color: #555; font-size: 13px;">Vennligst oppgi denne koden i skranken.</p>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
    authDomain: "magnet-c8c2a.firebaseapp.com",
    databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "magnet-c8c2a",
    storageBucket: "magnet-c8c2a.firebasestorage.app",
    messagingSenderId: "148748324402",
    appId: "1:148748324402:web:878ce829b2038c8613362b"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let selectedFiles = [];

  function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    
    if (files.length > 6) {
      alert("Du kan maksimalt velge 6 bilder!");
      return;
    }

    selectedFiles = files;
    const previewGrid = document.getElementById('previewGrid');
    previewGrid.innerHTML = '';

    selectedFiles.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const item = document.createElement('div');
        item.className = 'preview-item';
        const img = document.createElement('img');
        img.src = e.target.result;
        item.appendChild(img);
        previewGrid.appendChild(item);
      }
      reader.readAsDataURL(file);
    });

    document.getElementById('submitBtn').disabled = selectedFiles.length === 0;
  }

  function generate4DigitCode() {
    return Math.floor(1000 + Math.random() * 9000).toString();
  }

  async function uploadImages() {
    if (selectedFiles.length === 0) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Laster opp...";

    const imagePromises = selectedFiles.map(file => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    });

    const base64Images = await Promise.all(imagePromises);
    const uniqueCode = generate4DigitCode();

    db.ref('prints/' + uniqueCode).set({
      images: base64Images,
      timestamp: Date.now()
    }).then(() => {
      document.getElementById('generatedCode').innerText = uniqueCode;
      document.getElementById('codeDisplay').style.display = 'block';
      submitBtn.innerText = "Fullført!";
    }).catch(err => {
      alert("Feil ved opplasting: " + err.message);
      submitBtn.disabled = false;
      submitBtn.innerText = "Send inn (Fullfør)";
    });
  }
</script>

</body>
</html>
