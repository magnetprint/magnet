<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Bildeutskrift</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-card {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 20px;
    }

    h1 { margin-top: 0; color: #333; font-size: 22px; }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 3px;
      font-weight: bold;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #007aff;
    }

    .btn-search {
      background: #007aff;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-print {
      background: #34c759;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      display: none;
    }

    /* A4 BASKI ÖNİZLEME ALANI (2 Sütun x 3 Satır) */
    .a4-preview {
      width: 100%;
      max-width: 500px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      position: relative; /* Dikey kesim çizgisi için bağıl konumlandırma */
    }

    /* Tam ortadan yukarıdan aşağıya uzanan dikey kesik kesim çizgisi */
    .a4-preview::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 1px dashed #888888;
      pointer-events: none;
      z-index: 10;
    }

    .print-slot {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px dashed #ddd;
      border-radius: 4px;
      overflow: hidden;
      background: #fafafa;
    }

    .print-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* YAZDIRMA (PRINT) ÖZEL STİLLERİ */
    @media print {
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .admin-card {
        display: none !important; /* Arama kutusunu ve butonları gizle */
      }

      .a4-preview {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        padding: 0 !important;
        gap: 10mm !important; /* Baskı sırasındaki boşluk */
      }

      /* Baskıda kesim çizgisinin net çıkmasını sağla */
      .a4-preview::after {
        border-left: 1px dashed #000000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<div class="admin-card">
  <h1>Hent bilder for utskrift</h1>
  <div class="input-group">
    <input type="text" id="code input" placeholder="4-sifret kode" maxlength="4">
    <button class="btn-search" onclick="fetchImages()">Hent</button>
  </div>
  <button class="btn-print" id="printBtn" onclick="window.print()">Skriv ut (A4)</button>
</div>

<!-- A4 Önizleme ve Baskı Alanı -->
<div class="a4-preview" id="previewArea" style="display: none;"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
    authDomain: "magnet-c8c2a.firebaseapp.com",
    databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "magnet-c8c2a",
    storageBucket: "magnet-c8c2a.firebasestorage.app",
    messagingSenderId: "148748324402",
    appId: "1:148748324402:web:878ce829b2038c8613362b"
  };

  try { firebase.initializeApp(firebaseConfig); } catch (e) {}
  const db = firebase.database();

  function fetchImages() {
    const code = document.getElementById('code input').value.trim();
    if (code.length !== 4) {
      alert("Vennligst skriv inn en 4-sifret kode!");
      return;
    }

    const previewArea = document.getElementById('previewArea');
    const printBtn = document.getElementById('printBtn');
    previewArea.innerHTML = 'Henter bilder...';
    previewArea.style.display = 'grid';

    db.ref('prints/' + code).once('value').then((snapshot) => {
      const data = snapshot.val();
      if (!data || !data.images) {
        alert("Ingen bilder funnet for denne koden!");
        previewArea.style.display = 'none';
        printBtn.style.display = 'none';
        return;
      }

      previewArea.innerHTML = '';
      data.images.forEach(imgSrc => {
        const slot = document.createElement('div');
        slot.className = 'print-slot';
        const img = document.createElement('img');
        img.src = imgSrc;
        slot.appendChild(img);
        previewArea.appendChild(slot);
      });

      printBtn.style.display = 'block';
    }).catch(err => {
      alert("Feil oppstod: " + err.message);
      previewArea.style.display = 'none';
      printBtn.style.display = 'none';
    });
  }
</script>

</body>
</html>
