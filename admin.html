<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Utskriftspanel</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 500px; width: 100%; text-align: center; }
    
    h1 { color: #333; margin-bottom: 20px; }
    
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input[type="text"] { flex: 1; padding: 14px; border: 2px solid #007aff; border-radius: 8px; font-size: 20px; text-align: center; font-weight: bold; }
    .btn-search { background: #007aff; color: white; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .result-card { display: none; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    
    /* Web Önizlemesi Dinamik Grid */
    .print-grid {
      width: 100%;
      max-width: 400px;
      background: white;
      border: 1px solid #ccc;
      margin: 20px auto;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .print-grid .img-wrapper { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 4px; background: #eee; }
    .print-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .btn-print { background: #34c759; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }

    /* ========================================================= */
    /* DİNAMİK A4 BASKI AYARLARI (@media print) */
    /* ========================================================= */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        overflow: hidden;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      
      .search-box, h1, .result-card h3, .result-card p, .btn-print {
        display: none !important;
      }

      .container, .result-card {
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        display: flex !important;
        justify-content: center;
        align-items: center;
      }

      .print-grid {
        display: grid !important;
        justify-content: center !important;
        align-content: center !important;
        width: 210mm !important;
        height: 297mm !important;
        border: none !important;
        margin: 0 auto !important;
        padding: 0 !important;
      }

      /* 6'lı Paket Düzeni (2 Sütun x 3 Satır - 6x6 cm) */
      .print-grid.grid-6 {
        grid-template-columns: repeat(2, 6cm) !important;
        grid-template-rows: repeat(3, 6cm) !important;
        gap: 0.8cm !important;
      }
      .print-grid.grid-6 .img-wrapper, .print-grid.grid-6 img {
        width: 6cm !important;
        height: 6cm !important;
      }

      /* 9'lu ve 12'li Paket Düzeni (3 Sütun) */
      .print-grid.grid-9, .print-grid.grid-12 {
        grid-template-columns: repeat(3, 5.5cm) !important;
        gap: 0.5cm !important;
      }
      .print-grid.grid-9 .img-wrapper, .print-grid.grid-9 img,
      .print-grid.grid-12 .img-wrapper, .print-grid.grid-12 img {
        width: 5.5cm !important;
        height: 5.5cm !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Admin Utskriftspanel</h1>
  
  <div class="search-box">
    <input type="text" id="codeInput" placeholder="4-sifret kode" maxlength="4">
    <button class="btn-search" onclick="fetchOrder()">Hent bilder</button>
  </div>

  <div class="result-card" id="resultCard">
    <h3>Utskriftskode: <span id="displayCode" style="color: #007aff;">----</span></h3>
    <p style="color: #666; font-size: 14px;" id="displayTime"></p>
    
    <div class="print-grid" id="printGrid"></div>

    <button class="btn-print" onclick="startMobilePrint()">Skriv ut (Print)</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
    authDomain: "magnet-c8c2a.firebaseapp.com",
    databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "magnet-c8c2a",
    storageBucket: "magnet-c8c2a.firebasestorage.app",
    messagingSenderId: "148748324402",
    appId: "1:148748324402:web:878ce829b2038c8613362b"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function fetchOrder() {
    const code = document.getElementById('codeInput').value.trim();
    if (code.length !== 4) {
      alert("Vennligst skriv inn en gyldig 4-sifret kode!");
      return;
    }

    db.ref('prints/' + code).once('value').then((snapshot) => {
      const data = snapshot.val();
      
      if (!data) {
        alert("Ingen utskrift funnet med denne koden!");
        document.getElementById('resultCard').style.display = 'none';
        return;
      }

      document.getElementById('displayCode').innerText = code;
      
      if (data.timestamp) {
        const date = new Date(data.timestamp);
        document.getElementById('displayTime').innerText = "Mottatt: " + date.toLocaleTimeString();
      }

      const grid = document.getElementById('printGrid');
      grid.innerHTML = '';

      const imagesList = data.images || data.photos;
      const count = data.count || (imagesList ? imagesList.length : 6);

      // Grid sınıfını pakete göre güncelle
      grid.className = `print-grid grid-${count}`;

      if (count === 6) {
        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
      } else {
        grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
      }

      if (imagesList && Array.isArray(imagesList)) {
        imagesList.forEach(imgSrc => {
          const wrapper = document.createElement('div');
          wrapper.className = 'img-wrapper';

          const img = document.createElement('img');
          img.src = imgSrc;
          
          wrapper.appendChild(img);
          grid.appendChild(wrapper);
        });
      }

      document.getElementById('resultCard').style.display = 'block';

    }).catch(err => {
      alert("Feil ved henting: " + err.message);
    });
  }

  function startMobilePrint() {
    setTimeout(function() {
      window.print();
    }, 150);
  }
</script>

</body>
</html>
