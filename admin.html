<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Utskriftspanel</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 500px; width: 100%; text-align: center; }
    
    h1 { color: #333; margin-bottom: 20px; }
    
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input[type="text"] { flex: 1; padding: 14px; border: 2px solid #007aff; border-radius: 8px; font-size: 20px; text-align: center; font-weight: bold; }
    .btn-search { background: #007aff; color: white; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .result-card { display: none; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    
    /* Web Önizleme Grid'i */
    .print-grid {
      width: 100%;
      max-width: 400px;
      background: white;
      border: 1px solid #ccc;
      margin: 20px auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Magnet Kutu Yapısı (7x7 cm Şablonu) */
    .magnet-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #000;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Ortadaki 6x6 cm Görsel Alanı (7 cm içinde 6 cm) */
    .magnet-item .photo-area {
      width: 85.7%; 
      height: 85.7%;
      position: relative;
      z-index: 2;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .magnet-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Kenar Payındaki Reklam Yazıları (180 Derece Ters) */
    .border-text {
      position: absolute;
      font-size: 6.5px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      z-index: 1;
      pointer-events: none;
    }

    .border-text.top { 
      top: 2%; 
      left: 50%; 
      transform: translateX(-50%) rotate(180deg); 
    }
    .border-text.bottom { 
      bottom: 2%; 
      left: 50%; 
      transform: translateX(-50%) rotate(180deg); 
    }

    .btn-print { background: #34c759; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }

    /* ========================================================= */
    /* A4 BASKI DÜZENİ - TAM 7cm x 7cm (İÇİ 6cm x 6cm) */
    /* ========================================================= */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        overflow: hidden;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      
      .search-box, h1, .result-card h3, .result-card p, .btn-print {
        display: none !important;
      }

      .container, .result-card {
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        display: flex !important;
        justify-content: center;
        align-items: center;
      }

      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 7cm) !important;
        grid-template-rows: repeat(3, 7cm) !important;
        gap: 1.5cm 3.8cm !important;
        justify-content: center !important;
        align-content: center !important;
        width: 210mm !important;
        height: 297mm !important;
        border: none !important;
        margin: 0 auto !important;
        padding: 0 !important;
      }

      .magnet-item {
        width: 7cm !important;
        height: 7cm !important;
        border: 0.5pt solid #000 !important;
        box-sizing: border-box !important;
      }

      .magnet-item .photo-area {
        width: 6cm !important;
        height: 6cm !important;
      }

      .border-text {
        font-size: 5.5pt !important;
      }

      .border-text.top { top: 1.5mm !important; }
      .border-text.bottom { bottom: 1.5mm !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Admin Utskriftspanel</h1>
  
  <div class="search-box">
    <input type="text" id="codeInput" placeholder="4-sifret kode" maxlength="4">
    <button class="btn-search" onclick="fetchOrder()">Hent bilder</button>
  </div>

  <div class="result-card" id="resultCard">
    <h3>Utskriftskode: <span id="displayCode" style="color: #007aff;">----</span></h3>
    <p style="color: #666; font-size: 14px;" id="displayTime"></p>
    
    <div class="print-grid" id="printGrid"></div>

    <button class="btn-print" onclick="startMobilePrint()">Skriv ut (Print)</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
    authDomain: "magnet-c8c2a.firebaseapp.com",
    databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "magnet-c8c2a",
    storageBucket: "magnet-c8c2a.firebasestorage.app",
    messagingSenderId: "148748324402",
    appId: "1:148748324402:web:878ce829b2038c8613362b"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function fetchOrder() {
    const code = document.getElementById('codeInput').value.trim();
    if (code.length !== 4) {
      alert("Vennligst skriv inn en gyldig 4-sifret kode!");
      return;
    }

    db.ref('prints/' + code).once('value').then((snapshot) => {
      const data = snapshot.val();
      
      if (!data) {
        alert("Ingen utskrift funnet med denne koden!");
        document.getElementById('resultCard').style.display = 'none';
        return;
      }

      document.getElementById('displayCode').innerText = code;
      
      if (data.timestamp) {
        const date = new Date(data.timestamp);
        document.getElementById('displayTime').innerText = "Mottatt: " + date.toLocaleTimeString();
      }

      const grid = document.getElementById('printGrid');
      grid.innerHTML = '';

      // Firebase dizi/nesne uyumluluk kontrolü
      let imagesList = [];
      if (data.images) {
        imagesList = Array.isArray(data.images) ? data.images : Object.values(data.images);
      } else if (data.photos) {
        imagesList = Array.isArray(data.photos) ? data.photos : Object.values(data.photos);
      }

      if (imagesList && imagesList.length > 0) {
        imagesList.forEach(imgSrc => {
          const magnetItem = document.createElement('div');
          magnetItem.className = 'magnet-item';

          const textTop = document.createElement('span');
          textTop.className = 'border-text top';
          textTop.innerText = ‘Søstermagnet - Bilge og iLKE';

          const textBottom = document.createElement('span');
          textBottom.className = 'border-text bottom';
          textBottom.innerText = 'Produsert i Moss’;

          const photoArea = document.createElement('div');
          photoArea.className = 'photo-area';

          const img = document.createElement('img');
          img.src = imgSrc;
          img.alt = "Bilde";

          photoArea.appendChild(img);
          
          magnetItem.appendChild(textTop);
          magnetItem.appendChild(textBottom);
          magnetItem.appendChild(photoArea);

          grid.appendChild(magnetItem);
        });
        document.getElementById('resultCard').style.display = 'block';
      } else {
        alert("Bildene kunne ikke finnes i denne koden.");
      }

    }).catch(err => {
      alert("Feil ved henting: " + err.message);
    });
  }

  function startMobilePrint() {
    setTimeout(function() {
      window.print();
    }, 150);
  }
</script>

</body>
</html>
