<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>A4 Magnet Baskı Paneli</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 20px; margin: 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { background: #2a2a2a; border-radius: 8px; padding: 15px; width: 280px; text-align: center; }
    .card img { width: 100%; aspect-ratio: 1 / 1.414; object-fit: contain; background: white; border-radius: 4px; }
    .code { font-size: 22px; color: #34c759; font-weight: bold; margin-bottom: 10px; }
    .btn-print { background: #34c759; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }

    /* A4 Birebir Baskı Ayarları */
    @media print {
      @page { size: A4 portrait; margin: 0; }
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: fixed; left: 0; top: 0; width: 210mm; height: 297mm; }
      #printArea img { width: 100%; height: 100%; object-fit: contain; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<h1>🖨️ A4 Magnet Baskı Kuyruğu</h1>
<div class="grid" id="printGrid">Bekleniyor...</div>
<div id="printArea"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD2-k8VLYC-h4WEs5AbnH16wT9AYISjK8g",
  authDomain: "magnet-c8c2a.firebaseapp.com",
  databaseURL: "https://magnet-c8c2a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "magnet-c8c2a",
  storageBucket: "magnet-c8c2a.firebasestorage.app",
  messagingSenderId: "148748324402",
  appId: "1:148748324402:web:878ce829b2038c8613362b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref('prints').on('value', (snapshot) => {
    const data = snapshot.val();
    const grid = document.getElementById('printGrid');
    grid.innerHTML = '';

    if (!data) {
      grid.innerHTML = '<p>Bekleyen baskı isteği yok.</p>';
      return;
    }

    Object.keys(data).forEach(key => {
      const item = data[key];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="code">Kod: ${item.code}</div>
        <img src="${item.image}">
        <button class="btn-print" onclick="printPage('${key}', '${item.image}')">A4 Yazdır ve Sil</button>
      `;
      grid.appendChild(card);
    });
  });

  function printPage(key, imageSrc) {
    document.getElementById('printArea').innerHTML = `<img src="${imageSrc}">`;
    window.print();
    db.ref('prints/' + key).remove();
  }
</script>
</body>
</html>
